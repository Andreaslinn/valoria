name: valoria_oracle_beta

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - deploy/oracle.env.example
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - valoria_internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    environment:
      TZ: ${TZ:-America/Santiago}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - valoria_internal

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    env_file:
      - deploy/oracle.env.example
    environment:
      VALORIA_RUNTIME_PROFILE: oracle_beta
      ENVIRONMENT: beta
      REDIS_URL: redis://redis:6379/0
      REDIS_ENABLED: "true"
      SCHEDULER_ENABLED: "false"
      LISTING_ON_DEMAND_REFRESH_ENABLED: ${LISTING_ON_DEMAND_REFRESH_ENABLED:-true}
      PORTFOLIO_SNAPSHOT_WRITE_ENABLED: ${PORTFOLIO_SNAPSHOT_WRITE_ENABLED:-false}
      WEB_CONCURRENCY: "1"
      PORT: "8000"
      TZ: America/Santiago
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\"",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
    networks:
      - valoria_internal

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    command: ["python", "-m", "workers.scheduler"]
    env_file:
      - deploy/oracle.env.example
    environment:
      VALORIA_RUNTIME_PROFILE: oracle_beta
      ENVIRONMENT: beta
      REDIS_URL: redis://redis:6379/0
      REDIS_ENABLED: "true"
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      LISTING_ON_DEMAND_REFRESH_ENABLED: ${LISTING_ON_DEMAND_REFRESH_ENABLED:-true}
      PORTFOLIO_SNAPSHOT_WRITE_ENABLED: ${PORTFOLIO_SNAPSHOT_WRITE_ENABLED:-false}
      TZ: America/Santiago
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - reports_data:/app/reports
    networks:
      - valoria_internal

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    profiles:
      - manual
    restart: "no"
    command: ["python", "-m", "alembic", "upgrade", "head"]
    env_file:
      - deploy/oracle.env.example
    environment:
      VALORIA_RUNTIME_PROFILE: oracle_beta
      ENVIRONMENT: beta
      REDIS_URL: redis://redis:6379/0
      REDIS_ENABLED: "true"
      TZ: America/Santiago
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - valoria_internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      ORACLE_API_HOSTNAME: ${ORACLE_API_HOSTNAME:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile.oracle:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      - valoria_internal

networks:
  valoria_internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  reports_data:
