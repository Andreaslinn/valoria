[alembic]
# Ubicación de los scripts de migración
script_location = alembic

# Path a prependar al sys.path (permite `from infrastructure.db import ...`)
prepend_sys_path = .

# Separador de paths multi-versión
version_path_separator = os

# Plantilla de nombre de archivo: 0001_descripcion_slug.py
file_template = %%(rev)s_%%(slug)s

# Timezone para los timestamps en los scripts
timezone = UTC

# La URL real se carga desde settings en env.py (NO hardcodear aquí).
sqlalchemy.url = driver://user:pass@localhost/dbname


# ─────────────────────────────────────────────────────────
#  Logging
# ─────────────────────────────────────────────────────────
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
