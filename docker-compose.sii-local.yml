services:
  sii-postgres:
    image: postgres:16-alpine
    shm_size: "256m"
    ports:
      - "127.0.0.1:55432:5432"
    environment:
      POSTGRES_DB: valoria_sii_local
      POSTGRES_USER: sii_local
      POSTGRES_PASSWORD: sii_local_only
    volumes:
      - sii-local-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sii_local -d valoria_sii_local"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  sii-local-data:
